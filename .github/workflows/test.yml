name: Run Tests (Pytest)

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  app-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: uv sync --group dev --frozen

      - name: Run Tests
        run: uv run pytest

      - name: Generate coverage report
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          results-path: 'build/reports/junit.xml'
          coverage-path: 'build/coverage/clover.xml'
